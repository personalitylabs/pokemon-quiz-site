<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PersonalityLabs – What Pokémon Are You?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      flex: 1;
      min-height: 100vh;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('Eevee.jpeg');
      background-size: cover;
      background-position: 65% center;
      background-repeat: no-repeat;
      filter: contrast(1.08) saturate(1.15);
    }

    @media (min-width: 768px) {
      .hero-bg { background-position: center center; }
    }

    .overlay-flat   { position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
    .overlay-left   { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.20) 50%, transparent 100%); }
    .overlay-vert   { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, transparent 50%, rgba(0,0,0,0.50) 100%); }

    /* ── Nav ── */
    nav {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      text-decoration: none;
    }

    .logo img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .logo-text {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.875rem;
      text-decoration: none;
      color: rgba(255,255,255,0.8);
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    .nav-links a.active {
      color: #F5C518;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ── Hero content ── */
    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 72px);
      padding: 4rem 2.5rem 6rem 10%;
    }

    .hero-inner { max-width: 320px; }

    h1 {
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 1.25rem;
    }

    h1 .accent { color: #F5C518; }

    .description {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: rgba(255,255,255,0.85);
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: #F5C518;
      color: #000;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 20px 40px rgba(245,197,24,0.25);
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover  { background: #ffd700; }
    .btn:active { transform: scale(0.97); }

    /* ── Footer ── */
    footer {
      background: #000;
      padding: 1.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: right;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-bg"></div>
    <div class="overlay-flat"></div>
    <div class="overlay-left"></div>
    <div class="overlay-vert"></div>

    <!-- Nav -->
    <nav>
      <a href="#" class="logo">
        <img src="favicon.ico" alt="PersonalityLabs logo" />
        <span class="logo-text">PersonalityLabs</span>
      </a>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">FAQ</a></li>
      </ul>
    </nav>

    <!-- Hero content -->
    <div class="hero-content">
      <div class="hero-inner">
        <h1>What <span class="accent">Pokémon</span> Are You?</h1>
        <p class="description">
          Ever wondered what Pokémon you would be? Discover which Pokémon matches
          your unique personality best with this short and fun quiz!
        </p>
        <button class="btn">
          Start Quiz
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 9h11M9.5 4.5l4.5 4.5-4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <a href="#" class="logo">
      <img src="favicon.ico" alt="PersonalityLabs logo" />
      <span class="logo-text">PersonalityLabs</span>
    </a>
    <p class="footer-copy">© 2025 PersonalityLabs. All rights reserved.</p>
  </footer>

</body>
</html>
